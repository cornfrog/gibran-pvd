<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowAmber" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFC700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFC700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="15%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FDFBF0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDFBF0" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC700"/>
      <stop offset="50%" stop-color="#FFD633"/>
      <stop offset="100%" stop-color="#E5B200"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowAmber)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(255, 199, 0, 0.3)" stroke-width="2"/>

  <!-- Top Category Pill -->
  <g transform="translate(80, 85)">
    <rect width="320" height="38" rx="19" fill="rgba(255, 199, 0, 0.12)" stroke="rgba(255, 199, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="5" fill="#FFC700"/>
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFC700" letter-spacing="2">PROVIDENCE, RI • EST. 2004</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(80, 220)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#FDFBF0" letter-spacing="-2">
      GIBRAN<tspan fill="url(#gold)">PVD</tspan>
    </text>
  </g>

  <!-- Sub-headline / Role Tagline -->
  <g transform="translate(80, 280)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#EDE7CB" letter-spacing="1">
      FULL-TIME OPEN-FORMAT DJ <tspan fill="rgba(253, 251, 240, 0.4)">•</tspan> <tspan fill="#38BDF8">CONCERT TOUR MC</tspan> <tspan fill="rgba(253, 251, 240, 0.4)">•</tspan> <tspan fill="#FFC700">LIVE SOUND</tspan>
    </text>
  </g>

  <!-- Quote Motto -->
  <g transform="translate(80, 345)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="rgba(253, 251, 240, 0.75)" font-style="italic">
      “Entertainment for everyone. Good people deserve good music.”
    </text>
  </g>

  <!-- Stats Strip (4 Badges) -->
  <g transform="translate(80, 420)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="105" rx="16" fill="rgba(20, 20, 20, 0.9)" stroke="rgba(255, 199, 0, 0.3)" stroke-width="1.5"/>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFC700">7–8+</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="rgba(253, 251, 240, 0.7)" letter-spacing="1">YEARS PRO DJ</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(260, 0)">
      <rect width="235" height="105" rx="16" fill="rgba(20, 20, 20, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#38BDF8">17–24+</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="rgba(253, 251, 240, 0.7)" letter-spacing="1">MONTHLY EVENTS</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(520, 0)">
      <rect width="235" height="105" rx="16" fill="rgba(20, 20, 20, 0.9)" stroke="rgba(253, 251, 240, 0.2)" stroke-width="1.5"/>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#EDE7CB">15+ Yrs</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="rgba(253, 251, 240, 0.7)" letter-spacing="1">TOUR MC &amp; STAGE</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(780, 0)">
      <rect width="260" height="105" rx="16" fill="rgba(20, 20, 20, 0.9)" stroke="rgba(255, 199, 0, 0.3)" stroke-width="1.5"/>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFC700">100%</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="rgba(253, 251, 240, 0.7)" letter-spacing="1">SELF-CONTAINED RIG</text>
    </g>
  </g>

  <!-- Footer Attribution -->
  <g transform="translate(80, 570)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="rgba(253, 251, 240, 0.5)">
      RESIDENCIES &amp; CIRCUITS: THE HOT CLUB • CAFE AVA • NEWPORT • BOSTON • NYC • MIAMI • LA • GIBRANPVD.COM
    </text>
  </g>
</svg>
